<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Residents</title>
<style>
:root {
  --bg: #f4efe6; --panel: #fffaf2; --view: #ece4d4; --ink: #2b241c; --muted: #6f6253; --line: #ddd2c0;
  --accent: #3f6b4f; --accent-ink: #ffffff; --chip: #e3eee5; --chip-ink: #2f5a3d; --warn: #9a3b2b; --focus: #2f6fd1;
  --changed: #b9822a; --changed-bg: #fbf1dc; --sea: #9cc7de; --pin: #c0463c; --home: #5b4b9e; --bench: #6b4a2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --panel: #24211d; --view: #34302a; --ink: #f1eadf; --muted: #b5a998; --line: #3d3830;
    --accent: #8cc49e; --accent-ink: #13221a; --chip: #2c3d31; --chip-ink: #bfe3c8; --warn: #f0a08f; --focus: #8db6ff;
    --changed: #e7b660; --changed-bg: #3a3122; --sea: #2c4f63; --pin: #e0675b; --home: #8d7fd4; --bench: #c79a6a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1916; --panel: #24211d; --view: #34302a; --ink: #f1eadf; --muted: #b5a998; --line: #3d3830;
  --accent: #8cc49e; --accent-ink: #13221a; --chip: #2c3d31; --chip-ink: #bfe3c8; --warn: #f0a08f; --focus: #8db6ff;
  --changed: #e7b660; --changed-bg: #3a3122; --sea: #2c4f63; --pin: #e0675b; --home: #8d7fd4; --bench: #c79a6a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
input[type=text], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
input[type=text] { width: 100%; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { min-height: 100vh; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 17px; margin: 0 0 10px; }
.status { margin: 0; color: var(--muted); font-size: 13px; }
.status.error, .status.offline { color: var(--warn); }
.body { display: grid; grid-template-columns: 280px minmax(0, 1fr); }
nav { border-right: 1px solid var(--line); background: var(--panel); height: calc(100vh - 52px); overflow-y: auto; position: sticky; top: 0; padding: 10px 8px 24px; }
.search { width: 100%; margin-bottom: 8px; }
nav ul { list-style: none; margin: 0; padding: 0; }
nav li button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 10px; background: none; text-align: left; }
nav li button:hover { background: var(--view); }
nav li button[aria-current="true"] { background: var(--chip); color: var(--chip-ink); }
.who { flex: 1; min-width: 0; display: grid; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 12px; color: var(--muted); }
nav li button[aria-current="true"] .role { color: inherit; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--changed); color: #fff; font-weight: 600; }
.portrait { position: relative; flex: none; }
.portrait .view { width: 100%; height: 100%; background: var(--view); border-radius: 10px; }
.portrait.small { width: 52px; height: 52px; }
.portrait.big { width: 100%; aspect-ratio: 3 / 4; }
.portrait.big .view { cursor: grab; touch-action: none; }
.cell-error { position: absolute; inset: 4px 4px auto; margin: 0; font-size: 11px; color: var(--warn); overflow: hidden; }
main { padding: 12px 16px 40px; min-width: 0; }
.resident { display: grid; gap: 14px; max-width: 1100px; }
.top { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
.around { display: grid; gap: 6px; }
.around-tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.around-tools button, .reset, .add, .remove, .tabs button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.box { display: grid; gap: 6px; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; min-width: 0; }
.box.changed { border-color: var(--changed); background: var(--changed-bg); }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.box-label { font-weight: 600; }
.box .reset { height: 28px; }
.was { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.was > span { font-weight: 600; }
.was-lines { margin: 4px 0 0; padding-left: 20px; }
.problem { margin: 0; color: var(--warn); font-size: 13px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
.look { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; align-items: start; }
.picks { display: grid; gap: 6px; }
.pick { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.pick select { color: var(--ink); width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.swatch[aria-checked="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }
.swatch.natural { background: var(--view); font-size: 11px; font-weight: 700; }
.places { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.phases { display: grid; gap: 4px; align-content: start; }
.stops { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px; border-radius: 8px; }
.stops.shown { outline: 1px dashed var(--pin); }
.stop { display: inline-flex; align-items: center; gap: 4px; }
.stop .n { width: 20px; height: 20px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.icon { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0; font-size: 12px; flex: none; }
.map-side { display: grid; gap: 8px; position: sticky; top: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--chip); color: var(--chip-ink); border-color: var(--accent); font-weight: 600; }
.map { margin: 0; }
.map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--sea); }
.map figcaption { font-size: 12px; color: var(--muted); padding-top: 4px; }
.skipped { color: var(--warn); }
.lines { display: grid; gap: 6px; }
.line { display: flex; gap: 6px; align-items: start; }
.conversation { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; display: grid; gap: 6px; }
.conversation legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
.add, .remove { justify-self: start; }
.failed { margin: 16px; color: var(--warn); }
#fault { margin: 0; padding: 8px 16px; background: var(--panel); color: var(--warn); border-bottom: 1px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
.port { position: fixed !important; inset: 0; pointer-events: none; }
@media (max-width: 900px) {
  .places { grid-template-columns: minmax(0, 1fr); }
  .map-side { position: static; }
}
@media (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .top { grid-template-columns: minmax(0, 1fr); }
  .portrait.big { max-width: 340px; justify-self: center; }
  main { padding: 10px 16px 32px; }
}
</style>
</head>
<body>
<p id="fault" role="alert" hidden></p>
<div id="root"></div>
<script src="editor.js"></script>
</body>
</html>
