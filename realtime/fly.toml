# The multiplayer server on Fly.io, Toronto (specs/multiplayer.md §1.3, row 297).
# Deploy from the repo root (realtime/README.md "Deploy"):
#   fly deploy . --config realtime/fly.toml --dockerfile realtime/Dockerfile --remote-only
# Secrets (not here): SUPABASE_URL, SUPABASE_SECRET_KEY, ALLOWED_ORIGINS, ALLOWED_ORIGIN_PATTERNS,
# REALTIME_INTERNAL_SECRET (M2).

app = "tethos-rt"
primary_region = "yyz"
# Colyseus drains on SIGTERM: rooms broadcast sys:restart and close with 4010, then exit.
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # One stateful process holds every room: never stop it for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 300
    hard_limit = 400

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
